[package]
name = "shopify-client"
version = "1.5.1"
edition = "2021"
rust-version = "1.70"
description = "Type-safe, async Rust client for the Shopify Admin and Storefront APIs"
authors = ["Sahil Sinha"]
repository = "https://github.com/sinha-sahil/shopify-rust-client"
homepage = "https://github.com/sinha-sahil/shopify-rust-client"
documentation = "https://docs.rs/shopify-client"
license = "MIT"
keywords = ["shopify", "api", "client", "ecommerce", "webhooks"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"
exclude = [".gitignore", ".vscode/*", "types/**"]

[dependencies]
reqwest = { version = "0.12.4", features = ["json"] }
serde = { version = "1.0.201", features = ["derive"] }
serde_json = "1.0.117"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "serde-human-readable"], optional = true }

[dev-dependencies]
cargo-husky = { version = "1", features = ["user-hooks"] }

[features]
default = []
storefront = ["dep:time"]
