# Shared admin types. Non-top file - must use full paths for all references.

Common:
  PageInfo:
    type: object
    description: 'Pagination metadata for a connection'
    required:
      - hasNextPage
    properties:
      hasNextPage:
        type: boolean
      hasPreviousPage:
        type: boolean
      startCursor:
        type: string
      endCursor:
        type: string

  AccessScope:
    type: object
    description: 'An OAuth access scope granted to the app'
    required:
      - handle
    properties:
      handle:
        type: string

  UserError:
    type: object
    description: 'An error returned from a GraphQL mutation'
    required:
      - message
    properties:
      field:
        type: array
        items:
          type: string
      message:
        type: string
